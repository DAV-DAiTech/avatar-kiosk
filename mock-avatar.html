<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock avatar</title>
<style>
  html, body { margin: 0; height: 100%; background: #e9edf3; font-family: system-ui, sans-serif; overflow: hidden; }
  /* A stand-in "full-body person" so layout, framing and zoom can be checked without spending credits. */
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tag { position: absolute; left: 12px; bottom: 12px; padding: 6px 10px; border-radius: 8px; background: #fff; color: #333; font-size: 13px; }
</style>
</head>
<body>
<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
  <circle cx="50" cy="16" r="7" fill="#c9a27e"/>
  <rect x="38" y="24" width="24" height="34" rx="6" fill="#1f3a68"/>
  <rect x="31" y="26" width="7" height="28" rx="3.5" fill="#1f3a68"/>
  <rect x="62" y="26" width="7" height="28" rx="3.5" fill="#1f3a68"/>
  <rect x="40" y="57" width="9" height="38" rx="3" fill="#2b2b2b"/>
  <rect x="51" y="57" width="9" height="38" rx="3" fill="#2b2b2b"/>
</svg>
<div class="tag">Mock avatar · no credits used</div>
</body>
</html>
